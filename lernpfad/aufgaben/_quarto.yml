# Eigenes Projekt: loi-moi (pre-render) erzeugt c/ aus bausteine/*/assignments, Einstellungen aus loimoi.yml.
# Extension und Brand über Symlinks auf den Wurzelordner. Einstellungen der _quarto.yml im Wurzelordner gelten hier
# nicht, die nötigen stehen deshalb unten
project:
  type: default
  output-dir: ../../__output/lernpfad/aufgaben
  pre-render: _extensions/matthiasbaitsch/loimoi/pre-render.ts
  render:
    - c/**/*.qmd

lang: de
engine: jupyter
jupyter: python3

execute:
  echo: false
  daemon: 3600
  freeze: auto

fig-align: center
fig-format: svg

author:
  - Matthias Baitsch

crossref:
    exr-title: "Aufgabe"
    exr-prefix: "Aufgabe"

format-links: true

# Literatur nur bei den Aufgaben (Typst setzt bei den Folien sonst eine leere Folie ans Ende)
bibliography: ../../bausteine/bibliographie.bib
csl: ../../bausteine/style.csl

resources:
  - "**/*.zip"

# Logo der Brand (hsbo-brand, _brand/) im Querformat auf den Aufgabenblättern, wie in quarto-tinh
format:
  tinh-assignments-html: default
  tinh-assignments-typst:
    logo:
      path: medium
      width: 5cm
