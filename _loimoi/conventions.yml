# Logical name → names tried, upward from the working directory
names:
  building-blocks: [building-blocks, bausteine]

# Collection folder → language of the words in recipes and steps (words/<language>.yml); default en
collection-languages:
  exercises: en
  aufgaben: de
  folien: de

# Collection folder → recipe
collection-recipes:
  exercises: exercises
  aufgaben: exercises
  folien: slides

# Recipe → collection folder → ingredient folder
ingredient-folders:
  exercises:
    exercises: exercises
    aufgaben: aufgaben
  slides:
    folien: folien
