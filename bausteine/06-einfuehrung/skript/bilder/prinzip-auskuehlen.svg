<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <pattern id="schraffur" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#b0b0b0"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#808080" stroke-width="2"/>
    </pattern>
    <marker id="rot" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="blau" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Außenluft und Erdreich -->
  <rect width="600" height="320" fill="#e3f0fb"/>
  <rect y="320" width="600" height="70" fill="#d7c4a8"/>

  <!-- Gebäude: Speichermasse (Hülle) und Innenraum -->
  <polygon points="170,320 170,170 150,170 300,65 450,170 430,170 430,320" fill="url(#schraffur)" stroke="#555" stroke-width="1.5"/>
  <polygon points="188,302 188,165 300,87 412,165 412,302" fill="#fde3c8" stroke="#555" stroke-width="1"/>
  <!-- Innenwand und Decke als Speichermasse -->
  <rect x="188" y="215" width="224" height="12" fill="url(#schraffur)" stroke="#555" stroke-width="1"/>
  <rect x="296" y="227" width="10" height="75" fill="url(#schraffur)" stroke="#555" stroke-width="1"/>
  <!-- Fenster -->
  <rect x="170" y="240" width="18" height="45" fill="#bfe3f7" stroke="#555" stroke-width="1"/>

  <!-- Temperaturen -->
  <text x="300" y="185" text-anchor="middle" font-size="20">innen: <tspan font-style="italic">θ</tspan>(<tspan font-style="italic">t</tspan>)</text>
  <text x="20" y="35" font-size="20">außen: <tspan font-style="italic">θ</tspan><tspan font-size="13" dy="5">U</tspan></text>

  <!-- Wärmespeicher C -->
  <text x="300" y="268" text-anchor="middle" font-size="13" fill="#333" display="none">C</text>
  <line x1="470" y1="105" x2="425" y2="160" stroke="#333" stroke-width="1"/>
  <line x1="470" y1="105" x2="360" y2="221" stroke="#333" stroke-width="1"/>
  <text x="474" y="92" font-size="15">Speichermasse</text>
  <text x="474" y="110" font-size="15">(Wärmekapazität <tspan font-style="italic">C</tspan>)</text>

  <!-- Transmission -->
  <line x1="200" y1="262" x2="130" y2="262" stroke="#c62828" stroke-width="3" marker-end="url(#rot)"/>
  <line x1="200" y1="195" x2="130" y2="195" stroke="#c62828" stroke-width="3" marker-end="url(#rot)"/>
  <line x1="245" y1="135" x2="200" y2="100" stroke="#c62828" stroke-width="3" marker-end="url(#rot)"/>
  <line x1="250" y1="292" x2="250" y2="345" stroke="#c62828" stroke-width="3" marker-end="url(#rot)"/>
  <text x="20" y="150" font-size="15" fill="#c62828">Transmission</text>
  <text x="20" y="168" font-size="15" fill="#c62828">durch die Hülle</text>
  <text x="20" y="186" font-size="15" fill="#c62828"><tspan font-style="italic">U</tspan><tspan font-size="11" dy="4">j</tspan><tspan dy="-4"> </tspan><tspan font-style="italic">A</tspan><tspan font-size="11" dy="4">j</tspan></text>

  <!-- Lüftung -->
  <line x1="400" y1="250" x2="470" y2="250" stroke="#c62828" stroke-width="3" marker-end="url(#rot)"/>
  <line x1="470" y1="280" x2="400" y2="280" stroke="#1565c0" stroke-width="3" marker-end="url(#blau)"/>
  <rect x="430" y="240" width="0" height="0"/>
  <text x="478" y="255" font-size="15" fill="#c62828">warme Abluft</text>
  <text x="478" y="285" font-size="15" fill="#1565c0">kalte Zuluft</text>
  <text x="478" y="230" font-size="15">Lüftung <tspan font-style="italic">H</tspan><tspan font-size="11" dy="4">V</tspan></text>

  <!-- Bilanz -->
  <text x="300" y="375" text-anchor="middle" font-size="17">Wärmeverlust <tspan font-style="italic">Φ</tspan> = <tspan font-style="italic">H</tspan> (<tspan font-style="italic">θ</tspan> − <tspan font-style="italic">θ</tspan><tspan font-size="12" dy="4">U</tspan><tspan dy="-4">)  mit  </tspan><tspan font-style="italic">H</tspan> = Σ <tspan font-style="italic">U</tspan><tspan font-size="12" dy="4">j</tspan><tspan dy="-4"> </tspan><tspan font-style="italic">A</tspan><tspan font-size="12" dy="4">j</tspan><tspan dy="-4"> + </tspan><tspan font-style="italic">H</tspan><tspan font-size="12" dy="4">V</tspan></text>
</svg>
